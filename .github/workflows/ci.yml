name: CI

# master への push は deploy.yml が同じ検証をしてからデプロイするため、
# ここは PR だけを見る（二重実行を避ける）
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じ PR に続けて push したら古い実行は捨てる
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
